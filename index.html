<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Gym Tracker</h1>

    <form id="add-exercise-form">
      <input id="exercise-name" type="text" placeholder="New exercise (e.g. Bench Press)" required>
      <button type="submit">Add exercise</button>
    </form>

    <p id="storage-warning" hidden>Your browser is blocking saving, so changes will be lost when you close this page.</p>
    <p id="empty-message" hidden>No exercises yet. Add one above to get started.</p>
    <div id="exercise-list"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
